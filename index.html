<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 48px 64px;
      text-align: center;
      width: min(360px, 90vw);
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 24px;
    }

    #count {
      font-size: clamp(5rem, 20vw, 7rem);
      font-weight: 700;
      line-height: 1;
      color: #111827;
      margin-bottom: 40px;
      font-variant-numeric: tabular-nums;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    #increment {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    #increment:hover {
      background: #1d4ed8;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
    }

    #reset {
      background: #f3f4f6;
      color: #374151;
    }

    #reset:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Counter</h1>
    <div id="count">0</div>
    <div class="buttons">
      <button id="increment">Increment</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <script type="module">
    import { createCounter } from './counter.js';

    var display = document.getElementById('count');
    var counter = createCounter(display);

    document.getElementById('increment').addEventListener('click', function () {
      counter.increment();
    });

    document.getElementById('reset').addEventListener('click', function () {
      counter.reset();
    });
  </script>
</body>
</html>
