<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 48px 64px;
      text-align: center;
      width: min(90vw, 360px);
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 24px;
    }

    #count {
      font-size: clamp(5rem, 20vw, 7rem);
      font-weight: 700;
      color: #111827;
      line-height: 1;
      margin-bottom: 40px;
      font-variant-numeric: tabular-nums;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 80ms ease, opacity 120ms ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #btn-increment {
      background: #2563eb;
      color: #ffffff;
    }

    #btn-increment:hover {
      opacity: 0.9;
    }

    #btn-reset {
      background: #f3f4f6;
      color: #374151;
    }

    #btn-reset:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Counter</h1>
    <div id="count" aria-live="polite" aria-atomic="true">0</div>
    <div class="buttons">
      <button id="btn-increment">Increment</button>
      <button id="btn-reset">Reset</button>
    </div>
  </div>

  <script type="module">
    import { initCounter } from './counter.js';
    const countEl = document.getElementById('count');
    const btnIncrement = document.getElementById('btn-increment');
    const btnReset = document.getElementById('btn-reset');
    initCounter(countEl, btnIncrement, btnReset);
  </script>
</body>
</html>
